# Lapis Cloud -- SECOND PRODUCTION INSTANCE, for the ELB pilot (Ecclesia Libertas Biblica),
# co-located with the PdV instance (../production/) on the same host (pdv2, 159.195.38.47). This
# is a full, independent copy of ../production/docker-compose.yml -- own Postgres, own containers,
# own named volumes (Compose namespaces those by `name:` below automatically) -- with every
# HOST-visible port shifted so it can run alongside the PdV stack without collision.
#
# Container-INTERNAL ports are unchanged from ../production/ for every service EXCEPT LiveKit's
# `rtc.tcp_port`/`udp_port` and coturn's relay port range -- those two are the load-bearing
# exception, found live 2026-08-25 ("could not establish pc connection" on ELB, every ICE candidate
# pointed at PdV's own ports). LiveKit and coturn each bake their OWN configured port number
# literally into the WebRTC/TURN protocol payload they hand back to the browser (an ICE candidate,
# or an allocated relay address) -- unlike the plain HTTP signaling port (Caddy-proxied, the port
# number never reaches the browser), remapping ONLY the docker-compose host-side port for these two
# is not enough: the container-internal config itself must also use the externally-published number,
# or the browser gets told to connect to an address nothing is listening on externally. See
# livekit.yaml.template's/turnserver.conf.template's own comments for the specifics.
#
# Port scheme vs. ../production/ (PdV):
#   lapis-server        127.0.0.1:8080 -> 127.0.0.1:8081
#   postgres (host-only) 127.0.0.1:5432 -> 127.0.0.1:5433
#   livekit signaling    127.0.0.1:7880 -> 127.0.0.1:7885 (Caddy-proxied, host-side remap only, fine)
#   livekit ICE tcp      7881 (public)  -> 7891 (public, internal AND external -- see above)
#   livekit ICE udp      7882 (public)  -> 7892 (public, internal AND external -- see above)
#   coturn               3478 (public)  -> 3479 (public, host-side remap only, fine -- see turnserver.conf.template)
#   coturn relay range   51000-51019    -> 51020-51039 (public, internal AND external -- see above)
#   redis (host-only)    127.0.0.1:6379 -> 127.0.0.1:6380
#
# egress DOES use `network_mode: host` here, same as ../production/'s own egress and for the
# identical reason (Chrome-based Room-Composite/GRID/SPEAKER egress needs to reach this host's own
# public IP, "hairpin NAT" -- see that service's own comment for the full diagnosis). An earlier
# version of this file avoided host networking here, wrongly assuming LiveKit egress's embedded
# template server (port 7980, hardcoded) had no way to avoid colliding with PdV's own already-
# host-networked egress on the same port -- found live 2026-08-25 that `template_port` IS a real,
# documented `egress.yaml` field (verified directly against the pinned v1.13.0 source, not just
# assumed): ELB's own egress.yaml.template sets `template_port: 7981`, PdV's stays at the 7980
# default, no collision. GRID/SPEAKER external streaming therefore works identically to PdV now,
# not just Wave 1/Wave 2.
#
# Usage (from this directory):
#   cp .env.example .env   # fill in real secrets, never commit .env
#   ./render-secrets.sh    # renders livekit.yaml/turnserver.conf/egress.yaml from .env
#   docker compose up -d --build
#   docker compose logs -f lapis-server
name: lapis-cloud-elb

networks:
  internal:

services:
  postgres:
    image: postgres:17.10
    container_name: lapis-cloud-elb-postgres
    environment:
      POSTGRES_DB: ${LAPIS_DB_NAME:-lapiscloud}
      POSTGRES_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
    volumes:
      - lapis-elb-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  lapis-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: lapis-cloud-elb-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAPIS_DB_URL: jdbc:postgresql://postgres:5432/${LAPIS_DB_NAME:-lapiscloud}
      LAPIS_DB_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      LAPIS_DB_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
      LAPIS_PUBLIC_BASE_URL: ${LAPIS_PUBLIC_BASE_URL:?LAPIS_PUBLIC_BASE_URL must be set in .env}
      LAPIS_LIVEKIT_URL: ${LAPIS_LIVEKIT_URL:?LAPIS_LIVEKIT_URL must be set in .env}
      LAPIS_LIVEKIT_API_URL: http://livekit:7880
      LAPIS_LIVEKIT_API_KEY: ${LAPIS_LIVEKIT_API_KEY:?LAPIS_LIVEKIT_API_KEY must be set in .env}
      LAPIS_LIVEKIT_API_SECRET: ${LAPIS_LIVEKIT_API_SECRET:?LAPIS_LIVEKIT_API_SECRET must be set in .env}
      # Port 3479, NOT 3478 -- this instance's own coturn (see port-scheme comment above). Getting
      # this wrong would silently advertise PdV's TURN relay to ELB's own browsers instead.
      LAPIS_TURN_URLS: turn:${LAPIS_PUBLIC_IP:?LAPIS_PUBLIC_IP must be set in .env}:3479?transport=udp,turn:${LAPIS_PUBLIC_IP}:3479?transport=tcp
      LAPIS_TURN_SHARED_SECRET: ${LAPIS_TURN_SECRET:?LAPIS_TURN_SECRET must be set in .env}
      LAPIS_RECORDING_ENABLED: "true"
      LAPIS_EGRESS_OUTPUT_CONTAINER_DIR: /out
      LAPIS_EGRESS_OUTPUT_HOST_DIR: /app/egress-out
      LAPIS_STREAMING_ENABLED: "true"
      LAPIS_SECRET_ENCRYPTION_KEY: ${LAPIS_SECRET_ENCRYPTION_KEY:?LAPIS_SECRET_ENCRYPTION_KEY must be set in .env}
      LAPIS_ORACLE_GOLDAPI_KEY: ${LAPIS_ORACLE_GOLDAPI_KEY:-}
      LAPIS_ORACLE_METALPRICEAPI_KEY: ${LAPIS_ORACLE_METALPRICEAPI_KEY:-}
      LAPIS_ORACLE_ALPHAVANTAGE_KEY: ${LAPIS_ORACLE_ALPHAVANTAGE_KEY:-}
      LAPIS_SMTP_HOST: ${LAPIS_SMTP_HOST:-}
      LAPIS_SMTP_PORT: ${LAPIS_SMTP_PORT:-}
      LAPIS_SMTP_USERNAME: ${LAPIS_SMTP_USERNAME:-}
      LAPIS_SMTP_PASSWORD: ${LAPIS_SMTP_PASSWORD:-}
      LAPIS_SMTP_FROM_ADDRESS: ${LAPIS_SMTP_FROM_ADDRESS:-}
      LAPIS_SMTP_FROM_NAME: ${LAPIS_SMTP_FROM_NAME:-}
      LAPIS_SMTP_REPLY_TO: ${LAPIS_SMTP_REPLY_TO:-}
      LAPIS_BRAND_TITLE: ${LAPIS_BRAND_TITLE:-}
      LAPIS_BRAND_LOGO_PATH: ${LAPIS_BRAND_LOGO_PATH:-}
      # SEPA-Lastschriftlauf-Poller (V1.2.2) -- Bugfix (F-2, 2026-08-26): war seit V1.2.2 nirgends
      # durchgereicht, der Poller war damit in Produktion nie einschaltbar. ALLE optional, default
      # aus -- darf auf höchstens EINER Instanz aktiviert werden (siehe SepaBatchPoller KDoc; pdv2
      # UND diese ELB-Instanz sind zwei separate Instanzen -- nur eine darf den Poller einschalten).
      LAPIS_SEPA_POLLER_ENABLED: ${LAPIS_SEPA_POLLER_ENABLED:-}
      LAPIS_SEPA_POLL_INTERVAL_SECONDS: ${LAPIS_SEPA_POLL_INTERVAL_SECONDS:-}
      # Automatisiertes Mahnwesen (V1.2.7) -- ALLE optional, default aus. Fünf voneinander
      # unabhängige Sicherungen, bis eine reale Mahnung das Haus verlässt -- siehe DunningConfig/
      # DunningPoller KDoc und README.adoc "Automatisiertes Mahnwesen". Gleiche Ein-Instanz-Regel
      # wie beim SEPA-Poller oben.
      LAPIS_DUNNING_POLLER_ENABLED: ${LAPIS_DUNNING_POLLER_ENABLED:-}
      LAPIS_DUNNING_POLL_INTERVAL_SECONDS: ${LAPIS_DUNNING_POLL_INTERVAL_SECONDS:-}
      LAPIS_DUNNING_MAX_NOTICES_PER_TICK: ${LAPIS_DUNNING_MAX_NOTICES_PER_TICK:-}
      LAPIS_DUNNING_POSTAL_DISPATCH_ENABLED: ${LAPIS_DUNNING_POSTAL_DISPATCH_ENABLED:-}
      # PSP-Checkout via Stripe (V1.2.8) -- ALL optional, but ALL-OR-NOTHING for the two required
      # secrets: either both LAPIS_STRIPE_SECRET_KEY and LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET or
      # neither. A half configuration deliberately fails startup -- see PspConfig KDoc and
      # .env.example. LAPIS_STRIPE_API_BASE_URL is override-only for tests, never set here.
      LAPIS_STRIPE_SECRET_KEY: ${LAPIS_STRIPE_SECRET_KEY:-}
      LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET: ${LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET:-}
      LAPIS_PSP_WEBHOOK_TOLERANCE_SECONDS: ${LAPIS_PSP_WEBHOOK_TOLERANCE_SECONDS:-}
      LAPIS_PSP_MAX_CHECKOUT_AMOUNT_EUR: ${LAPIS_PSP_MAX_CHECKOUT_AMOUNT_EUR:-}
      LAPIS_PSP_CHECKOUT_TTL_MINUTES: ${LAPIS_PSP_CHECKOUT_TTL_MINUTES:-}
      # Ausgehende Webhooks (V1.3.2) -- OPTIONAL, default aus. LAPIS_WEBHOOKS_ENABLED=true also
      # requires LAPIS_SECRET_ENCRYPTION_KEY above (WebhookConfig.load fails fast otherwise, same
      # key as Wave 3 Streaming). LAPIS_WEBHOOKS_ALLOW_INSECURE intentionally omitted rather than
      # set to "false" -- see WebhookConfig KDoc "O4" (what is absent cannot be flipped on by a
      # copy-paste mistake). Review fix (Welle V1.3.2, Runde 2): before this fix, none of these
      # four reached the container at all -- LAPIS_WEBHOOKS_ENABLED=true in .env silently stayed
      # unseen by WebhookConfig.load(), same class of gap as the SEPA-Poller fix (F-2) in
      # ../production/docker-compose.yml.
      LAPIS_WEBHOOKS_ENABLED: ${LAPIS_WEBHOOKS_ENABLED:-}
      LAPIS_WEBHOOK_POLL_INTERVAL_SECONDS: ${LAPIS_WEBHOOK_POLL_INTERVAL_SECONDS:-}
      LAPIS_WEBHOOK_RETENTION_DAYS: ${LAPIS_WEBHOOK_RETENTION_DAYS:-}
      # First-admin bootstrap (see AdminBootstrap KDoc) -- only ever acts on a genuinely empty
      # `member` table, so safe to leave set permanently. Needs all three or none: bootstrap mode
      # only engages once LAPIS_BOOTSTRAP_ADMIN_DISPLAY_NAME is set.
      LAPIS_BOOTSTRAP_ADMIN_EMAIL: ${LAPIS_BOOTSTRAP_ADMIN_EMAIL:-}
      LAPIS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${LAPIS_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      LAPIS_BOOTSTRAP_ADMIN_PASSWORD: ${LAPIS_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - lapis-elb-document-storage:/app/document-storage
      - lapis-elb-egress-output:/app/egress-out
      - ./branding:/app/branding:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks: [internal]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: lapis-cloud-elb-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7885:7880"
      # No remap for these two -- must equal livekit.yaml.template's own rtc.tcp_port/udp_port, see
      # this file's own header comment.
      - "7891:7891/tcp"
      - "7892:7892/udp"
    networks: [internal]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.17.0-alpine
    container_name: lapis-cloud-elb-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      # listening-port itself is fine to remap (3479 host -> 3478 container) -- the client only
      # ever needs to reach it once for the initial control channel, Docker's own NAT handles the
      # return path transparently. The relay-port RANGE below is NOT fine to remap -- see this
      # file's own header comment: coturn allocates a relay address from its OWN internal range and
      # tells the client to connect there directly, so internal and external numbers must match.
      - "3479:3478/udp"
      - "3479:3478/tcp"
      - "51020-51039:51020-51039/udp"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: lapis-cloud-elb-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  # NOT `network_mode: host` -- see this file's own header comment "egress deliberately does NOT
  # use network_mode: host here" for why. Bridge-networked, same as every other service in this
  # stack; reaches its siblings by compose-internal service name (see egress.yaml's own ws_url/
  # redis.address, which say `livekit`/`redis`, not `127.0.0.1:...` like PdV's host-networked
  # config does).
  egress:
    image: livekit/egress:v1.13.0
    container_name: lapis-cloud-elb-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - lapis-elb-egress-output:/out
      - /tmp # egress scratch space
    cap_add:
      - SYS_ADMIN # documented as required since egress v1.7.6 (Chrome sandbox, Room-Composite egress)
    shm_size: '1gb'
    # network_mode: host -- see this file's own header comment "egress DOES use network_mode: host
    # here" for the hairpin-NAT reasoning (identical to ../production/'s own egress) and the
    # template_port: 7981 fix (egress.yaml.template) that makes this safe to run alongside PdV's own
    # host-networked egress on the same physical host.
    network_mode: host
    depends_on: [redis, livekit]
    restart: unless-stopped
    # No `ports:` mapping needed even under `network_mode: host` -- egress never listens for inbound
    # connections at all, same reasoning as ../production/'s own copy.

volumes:
  lapis-elb-postgres-data:
  lapis-elb-document-storage:
  lapis-elb-egress-output:
