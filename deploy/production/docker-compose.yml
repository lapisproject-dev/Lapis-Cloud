# Lapis Cloud -- PRODUCTION deployment. Replaces the earlier bare-JVM + systemd + native-PostgreSQL
# setup (see the pdv2 server's own infrastructure notes for that prior state) with a self-contained
# containerized stack: lapis-server (built from the repo-root Dockerfile, client bundle baked in)
# + PostgreSQL. Apache on the host stays exactly as it was -- it still reverse-proxies
# `https://<domain>/` to `127.0.0.1:8080`, which this compose file publishes the same way the old
# systemd unit did, so no Apache vhost change is needed for this cutover.
#
# Usage (from this directory):
#   cp .env.example .env   # fill in real secrets, never commit .env
#   docker compose up -d --build
#   docker compose logs -f lapis-server
#
# All secrets (DB password, LiveKit/coturn keys once the video-conferencing stack is added) live
# ONLY in the untracked `.env` file on the host -- never in this file, matching this repo's
# `deploy/local/docker-compose.yml` posture (see that file's own header) and the general house rule
# against committed secrets.
name: lapis-cloud

# `internal`: postgres/lapis-server/livekit/redis/egress -- every service that has a genuine
# internal-communication need with another service in this stack. `coturn` deliberately does NOT
# join it (see that service's own comment) -- a TURN relay has zero internal-service dependencies
# of its own, so keeping it off this network means a future coturn CVE/compromise (it has the
# largest raw public attack surface here -- a STUN/TURN protocol parser reachable from the entire
# internet) cannot pivot onto redis (unauthenticated by design, see that service's comment) or
# egress (holds SYS_ADMIN). `network_mode` is left at Compose's implicit default for coturn instead
# -- simpler than inventing a second named network for a service with nothing to talk to.
networks:
  internal:

services:
  postgres:
    # Pinned to the exact version the prior native install ran (17.10) -- matches this repo's
    # pin-exact-versions posture (see gradle/libs.versions.toml, deploy/local/docker-compose.yml).
    image: postgres:17.10
    container_name: lapis-cloud-postgres
    environment:
      POSTGRES_DB: ${LAPIS_DB_NAME:-lapiscloud}
      POSTGRES_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
    volumes:
      - lapis-postgres-data:/var/lib/postgresql/data
    # Loopback-only, and only needed at all for manual operator access (pg_dump/psql from the host)
    # -- lapis-server reaches this over the compose-internal network by service name, never through
    # this published port.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  lapis-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: lapis-cloud-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAPIS_DB_URL: jdbc:postgresql://postgres:5432/${LAPIS_DB_NAME:-lapiscloud}
      LAPIS_DB_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      LAPIS_DB_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
      LAPIS_PUBLIC_BASE_URL: ${LAPIS_PUBLIC_BASE_URL:?LAPIS_PUBLIC_BASE_URL must be set in .env}
      # Video conferencing (Videokonferenzen Wave 1) -- see README.adoc "Video conferencing".
      # LAPIS_LIVEKIT_URL is the PUBLIC wss:// origin browsers connect to (Apache-proxied);
      # LAPIS_LIVEKIT_API_URL deliberately does NOT derive from it (ConferenceConfig.load()'s
      # default derivation would round-trip server-to-LiveKit admin calls back out through Apache)
      # -- it points at the compose-internal service name instead, same network, no TLS needed.
      LAPIS_LIVEKIT_URL: ${LAPIS_LIVEKIT_URL:?LAPIS_LIVEKIT_URL must be set in .env}
      LAPIS_LIVEKIT_API_URL: http://livekit:7880
      LAPIS_LIVEKIT_API_KEY: ${LAPIS_LIVEKIT_API_KEY:?LAPIS_LIVEKIT_API_KEY must be set in .env}
      LAPIS_LIVEKIT_API_SECRET: ${LAPIS_LIVEKIT_API_SECRET:?LAPIS_LIVEKIT_API_SECRET must be set in .env}
      LAPIS_TURN_URLS: turn:${LAPIS_PUBLIC_IP:?LAPIS_PUBLIC_IP must be set in .env}:3478?transport=udp,turn:${LAPIS_PUBLIC_IP}:3478?transport=tcp
      LAPIS_TURN_SHARED_SECRET: ${LAPIS_TURN_SECRET:?LAPIS_TURN_SECRET must be set in .env}
      # Video conferencing (Videokonferenzen Wave 2 "Aufzeichnung" + Wave 3 "Externes Streaming")
      # -- see README.adoc "Video conferencing". LAPIS_EGRESS_OUTPUT_CONTAINER_DIR/
      # LAPIS_EGRESS_OUTPUT_HOST_DIR both point at the SAME lapis-egress-output named volume below
      # (mounted at /out in the sibling `egress` container, /app/egress-out here) -- see
      # ConferenceRecordingConfig KDoc "Two deliberately separate output-directory env vars" for why
      # they are never collapsed into one, even though this deployment (unlike local dev) runs both
      # sides in Docker. LAPIS_EGRESS_OUTPUT_HOST_DIR itself is already baked into the Dockerfile as
      # an ENV default matching this mount point -- repeated here only for discoverability alongside
      # every other Wave 2/3 setting.
      LAPIS_RECORDING_ENABLED: "true"
      LAPIS_EGRESS_OUTPUT_CONTAINER_DIR: /out
      LAPIS_EGRESS_OUTPUT_HOST_DIR: /app/egress-out
      # Wave 3 "Externes Streaming" specifically (recording above works without these two --
      # ConferenceStreamingConfig gates external RTMP egress on its OWN enabled flag, see its
      # KDoc). LAPIS_SECRET_ENCRYPTION_KEY is the AES-256-GCM key SecretBox uses to encrypt
      # stream destination RTMP keys at rest (32 raw bytes, base64-encoded) -- generate with
      # `openssl rand -base64 32`, never reuse across deployments.
      LAPIS_STREAMING_ENABLED: "true"
      LAPIS_SECRET_ENCRYPTION_KEY: ${LAPIS_SECRET_ENCRYPTION_KEY:?LAPIS_SECRET_ENCRYPTION_KEY must be set in .env}
      # Price-Oracle Gold anchor (V0.6.6) -- all three OPTIONAL, unlike the ":?must be set" vars
      # above. Only needed if this deployment's anchor is switched to GOLD_XAU (default stays
      # BITCOIN_BTC, which needs none of these). A gold anchor requires at least TWO of the three;
      # configuring all three is recommended so one provider outage does not halt donation
      # conversion -- see README.adoc "Price-Oracle: Gold anchor (optional)". The Alpha Vantage key
      # additionally makes that source reach www.ecb.europa.eu for its currency conversion leg.
      LAPIS_ORACLE_GOLDAPI_KEY: ${LAPIS_ORACLE_GOLDAPI_KEY:-}
      LAPIS_ORACLE_METALPRICEAPI_KEY: ${LAPIS_ORACLE_METALPRICEAPI_KEY:-}
      LAPIS_ORACLE_ALPHAVANTAGE_KEY: ${LAPIS_ORACLE_ALPHAVANTAGE_KEY:-}
      # Echter E-Mail-Versand (SMTP, V1.2.3) -- alle OPTIONAL, aber ALL-OR-NOTHING: entweder alle
      # fünf Pflichtwerte (HOST/USERNAME/PASSWORD/FROM_ADDRESS/FROM_NAME) oder gar keiner. Eine
      # halbe Konfiguration lässt den Server bewusst nicht starten -- siehe README.adoc
      # "E-Mail-Versand". LAPIS_SMTP_REPLY_TO ist optional -- gesetzt, trägt jede ausgehende Mail
      # einen Reply-To-Header darauf; ungesetzt, verweist die Mail-Fußzeile stattdessen auf
      # LAPIS_PUBLIC_BASE_URL.
      LAPIS_SMTP_HOST: ${LAPIS_SMTP_HOST:-}
      LAPIS_SMTP_PORT: ${LAPIS_SMTP_PORT:-}
      LAPIS_SMTP_USERNAME: ${LAPIS_SMTP_USERNAME:-}
      LAPIS_SMTP_PASSWORD: ${LAPIS_SMTP_PASSWORD:-}
      LAPIS_SMTP_FROM_ADDRESS: ${LAPIS_SMTP_FROM_ADDRESS:-}
      LAPIS_SMTP_FROM_NAME: ${LAPIS_SMTP_FROM_NAME:-}
      LAPIS_SMTP_REPLY_TO: ${LAPIS_SMTP_REPLY_TO:-}
      # White-Label-Branding (V1.2.5) -- BEIDE optional, siehe .env.example. Der Text "Betrieben
      # mit Lapis Cloud" bleibt davon unberührt IMMER sichtbar -- siehe README.adoc
      # "White-Label-Branding".
      LAPIS_BRAND_TITLE: ${LAPIS_BRAND_TITLE:-}
      LAPIS_BRAND_LOGO_PATH: ${LAPIS_BRAND_LOGO_PATH:-}
      # SEPA-Lastschriftlauf-Poller (V1.2.2) -- Bugfix (F-2, 2026-08-26): war seit V1.2.2 nirgends
      # durchgereicht, der Poller war damit in Produktion nie einschaltbar. ALLE optional, default
      # aus -- darf auf höchstens EINER Instanz aktiviert werden (siehe SepaBatchPoller KDoc).
      LAPIS_SEPA_POLLER_ENABLED: ${LAPIS_SEPA_POLLER_ENABLED:-}
      LAPIS_SEPA_POLL_INTERVAL_SECONDS: ${LAPIS_SEPA_POLL_INTERVAL_SECONDS:-}
      # Automatisiertes Mahnwesen (V1.2.7) -- ALLE optional, default aus. Fünf voneinander
      # unabhängige Sicherungen, bis eine reale Mahnung das Haus verlässt -- siehe DunningConfig/
      # DunningPoller KDoc und README.adoc "Automatisiertes Mahnwesen".
      LAPIS_DUNNING_POLLER_ENABLED: ${LAPIS_DUNNING_POLLER_ENABLED:-}
      LAPIS_DUNNING_POLL_INTERVAL_SECONDS: ${LAPIS_DUNNING_POLL_INTERVAL_SECONDS:-}
      LAPIS_DUNNING_MAX_NOTICES_PER_TICK: ${LAPIS_DUNNING_MAX_NOTICES_PER_TICK:-}
      LAPIS_DUNNING_POSTAL_DISPATCH_ENABLED: ${LAPIS_DUNNING_POSTAL_DISPATCH_ENABLED:-}
      # PSP-Checkout via Stripe (V1.2.8) -- ALL optional, but ALL-OR-NOTHING for the two required
      # secrets: either both LAPIS_STRIPE_SECRET_KEY and LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET or
      # neither. A half configuration deliberately fails startup -- see PspConfig KDoc and
      # .env.example. LAPIS_STRIPE_API_BASE_URL is override-only for tests, never set here.
      LAPIS_STRIPE_SECRET_KEY: ${LAPIS_STRIPE_SECRET_KEY:-}
      LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET: ${LAPIS_STRIPE_WEBHOOK_SIGNING_SECRET:-}
      LAPIS_PSP_WEBHOOK_TOLERANCE_SECONDS: ${LAPIS_PSP_WEBHOOK_TOLERANCE_SECONDS:-}
      LAPIS_PSP_MAX_CHECKOUT_AMOUNT_EUR: ${LAPIS_PSP_MAX_CHECKOUT_AMOUNT_EUR:-}
      LAPIS_PSP_CHECKOUT_TTL_MINUTES: ${LAPIS_PSP_CHECKOUT_TTL_MINUTES:-}
      # Ausgehende Webhooks (V1.3.2) -- OPTIONAL, default aus. LAPIS_WEBHOOKS_ENABLED=true also
      # requires LAPIS_SECRET_ENCRYPTION_KEY above (WebhookConfig.load fails fast otherwise, same
      # key as Wave 3 Streaming). LAPIS_WEBHOOKS_ALLOW_INSECURE intentionally omitted rather than
      # set to "false" -- see WebhookConfig KDoc "O4" (what is absent cannot be flipped on by a
      # copy-paste mistake). Review fix (Welle V1.3.2, Runde 2): before this fix, none of these
      # four reached the container at all -- LAPIS_WEBHOOKS_ENABLED=true in .env silently stayed
      # unseen by WebhookConfig.load(), same class of gap as the SEPA-Poller fix (F-2) above.
      LAPIS_WEBHOOKS_ENABLED: ${LAPIS_WEBHOOKS_ENABLED:-}
      LAPIS_WEBHOOK_POLL_INTERVAL_SECONDS: ${LAPIS_WEBHOOK_POLL_INTERVAL_SECONDS:-}
      LAPIS_WEBHOOK_RETENTION_DAYS: ${LAPIS_WEBHOOK_RETENTION_DAYS:-}
      # Oeffentliche Website-Integration (V1.4.1a) -- OPTIONAL, default aus.
      # LAPIS_EMBED_ALLOW_INSECURE bewusst weggelassen, nicht auf "" gesetzt (WebhookConfig "O4").
      LAPIS_EMBED_ENABLED: ${LAPIS_EMBED_ENABLED:-}
      LAPIS_EMBED_ALLOWED_ORIGINS: ${LAPIS_EMBED_ALLOWED_ORIGINS:-}
    volumes:
      # Named volumes, not bind mounts -- survive `docker compose up -d --build` image rebuilds/
      # recreations, which a container's own writable layer would not. lapis-document-storage
      # matches LAPIS_DOCUMENT_STORAGE_ROOT baked into the Dockerfile (/app/document-storage);
      # lapis-egress-output is the shared raw-recording volume (see environment: above).
      - lapis-document-storage:/app/document-storage
      - lapis-egress-output:/app/egress-out
      # White-Label-Branding (V1.2.5) -- a BIND mount, deliberately NOT a named volume like the two
      # above: the logo file is deployment-local, operator-supplied, version-controlled-adjacent
      # content (see .gitignore's "deploy/production/branding/*" entry), not runtime state a
      # rebuild must preserve. The operator drops the file directly into
      # deploy/production/branding/ on the host; :ro because lapis-server only ever reads it.
      - ./branding:/app/branding:ro
    ports:
      # Loopback-only, matching the prior systemd deployment's Apache-proxies-to-127.0.0.1:8080
      # setup exactly -- Apache's vhost config needs no change for this cutover.
      - "127.0.0.1:8080:8080"
    networks: [internal]
    restart: unless-stopped

  # Video conferencing (Videokonferenzen Wave 1: live audio/video/screen-share/chat + Wave 2
  # "Aufzeichnung" + Wave 3 "Externes Streaming" via the redis/egress services below).
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: lapis-cloud-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      # Rendered by render-secrets.sh from livekit.yaml.template -- see README.adoc.
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling/HTTP/Twirp admin API -- loopback only. Apache reverse-proxies this publicly as
      # wss://video.parteidervernunft.de; lapis-server itself reaches this over the
      # compose-internal network by service name (LAPIS_LIVEKIT_API_URL above), never through this
      # published port.
      - "127.0.0.1:7880:7880"
      # ICE/TCP fallback -- PUBLIC, unlike every other port in this file. Real browsers connect
      # here directly for WebRTC media; this cannot go through Apache's HTTP reverse proxy.
      - "7881:7881/tcp"
      # ICE/UDP mux -- PUBLIC, single port (not a range) -- simpler firewall surface, matches
      # deploy/local/livekit.yaml's own choice and LiveKit's recommended production default.
      - "7882:7882/udp"
    networks: [internal]
    restart: unless-stopped

  # Deliberately NOT on the `internal` network -- see that network's own top-of-file comment. A TURN
  # relay has no internal-service dependencies of its own; keeping it off `internal` means it cannot
  # reach redis/egress even if compromised via its own (large, unauthenticated-by-protocol-design)
  # public STUN/TURN attack surface.
  coturn:
    image: coturn/coturn:4.17.0-alpine
    container_name: lapis-cloud-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      # Rendered by render-secrets.sh from turnserver.conf.template -- see README.adoc.
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      # PUBLIC -- coturn is a TURN relay; real browsers connect here directly when a direct/host
      # ICE candidate fails (restrictive NAT, symmetric firewall, etc.).
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "51000-51019:51000-51019/udp"
    restart: unless-stopped

  # V1.0 Videokonferenzen, Wave 2 "Aufzeichnung" -- LiveKit's own self-hosting docs state the Egress
  # service uses Redis message queues to load-balance and communicate with the LiveKit server; both
  # `livekit` and `egress` below point at this SAME instance. Mirrors deploy/local/docker-compose.yml.
  redis:
    image: redis:7.4-alpine
    container_name: lapis-cloud-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    restart: unless-stopped
    # LOOPBACK-ONLY port publish, added 2026-08-15 alongside `egress`'s move to `network_mode: host`
    # (see that service's own comment for why) -- a host-networked egress can no longer resolve the
    # compose-internal `redis` DNS name or reach it over the `internal` bridge network at all, so it
    # needs a host-loopback path instead. `127.0.0.1:` binding (not `0.0.0.0:`) keeps this at the same
    # exposure level as every other loopback-bound admin surface on this host (livekit's own signaling
    # port, lapis-server itself) -- still unreachable from outside the host, still has zero auth of
    # its own (no `requirepass`), so still not a meaningful new attack surface despite no longer being
    # "no ports: at all".
    ports:
      - "127.0.0.1:6379:6379"

  # V1.0 Videokonferenzen, Wave 2 "Aufzeichnung" + Wave 3 "Externes Streaming". Drives BOTH the raw
  # per-track recording pipeline (Track Egress, ConferenceRecordingConfig on the lapis-server side)
  # and external RTMP streaming (Room/Participant Composite Egress, ConferenceStreamDestinationsScreen)
  # -- one egress service handles both, matching deploy/local/docker-compose.yml.
  egress:
    image: livekit/egress:v1.13.0
    container_name: lapis-cloud-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      # Rendered by render-secrets.sh from egress.yaml.template -- see README.adoc.
      - ./egress.yaml:/etc/egress.yaml:ro
      # The raw per-track sink -- CONTAINER path (/out), matching ConferenceRecordingConfig's
      # outputContainerDir default. lapis-server reads the SAME bytes back from ITS OWN mount of
      # this same named volume (LAPIS_EGRESS_OUTPUT_HOST_DIR=/app/egress-out on that service) --
      # see that service's own environment: comment.
      - lapis-egress-output:/out
      - /tmp # egress scratch space, matches deploy/local/docker-compose.yml
    cap_add:
      - SYS_ADMIN # documented as required since egress v1.7.6 (Chrome sandbox, Room-Composite egress)
    # Chrome (Room-Composite/GRID/SPEAKER egress) needs far more shared memory than Docker's 64MB
    # default for its renderer/GPU process buffers -- a real, legitimate fix on its own (found and
    # applied 2026-08-15), but NOT sufficient by itself for "Start signal not received" (code 412) on
    # THIS host -- see the network_mode comment below for the actual primary cause found the same day.
    shm_size: '1gb'
    # PRIMARY FIX for "Start signal not received" (code 412), found 2026-08-15: `livekit.yaml`s
    # `rtc.node_ip: 159.195.38.47` (this host's own public IP, required so REAL external browsers get
    # a reachable ICE candidate) is advertised to EVERY WebRTC participant unconditionally -- including
    # Chrome running INSIDE this container for Room-Composite (GRID/SPEAKER) egress, which joins the
    # room as a real participant to render the composite. On this host (like many VPS/cloud providers),
    # a container CANNOT reach the host's own public IP from the inside ("hairpin NAT" is not
    # supported) -- verified live: `curl` to `159.195.38.47:7881` from a regular bridge-networked
    # container times out; from a `--network host` container it connects immediately. Chrome's own
    # WebRTC connection to the room therefore never gets media, the room disconnects, and the
    # template's own `EgressHelper.endRecording()` fires (`chrome: END_RECORDING` in the logs) without
    # `startRecording()` ever having run -- egress waits out ITS OWN startup timeout believing the
    # recording never started ("Start signal not received"), even though Chrome's page loaded and ran
    # fine the whole time. `network_mode: host` puts this container directly on the host's real network
    # namespace, so `159.195.38.47` is no longer a NAT hop away -- confirmed fix, not a workaround.
    # Requires `redis.address`/`ws_url` in `egress.yaml` to use `127.0.0.1` instead of the
    # compose-internal DNS names below (those don't resolve without a `networks:` attachment), and
    # `redis`'s own loopback-only port publish above. `ConferenceStreamLayout.SINGLE_PARTICIPANT`
    # (SDK-based, never launches Chrome) was unaffected throughout, since the Go-native WebRTC client
    # egress uses for that path evidently tolerates/routes around this differently than Chrome's own
    # stack does -- not a coincidence worth re-investigating now that the actual cause is confirmed.
    network_mode: host
    depends_on: [redis, livekit]
    restart: unless-stopped
    # No `ports:` mapping needed even under `network_mode: host` -- egress never listens for inbound
    # connections at all, it's driven entirely through Redis and makes only outbound connections
    # (LiveKit, the RTMP destination, its own embedded template server on loopback). `host` networking
    # here is about EGRESS reaching OUT past the hairpin-NAT boundary (see above), not about anything
    # reaching IN to egress -- its attack surface from the rest of the host's network is unchanged.

volumes:
  lapis-postgres-data:
  lapis-document-storage:
  lapis-egress-output:
