# PROD_HOST / ELB_HOST / STAGING_HOST / ${LAPIS_PUBLIC_IP} below are placeholders for this
# deployment's real hostnames/IP -- see the NOTE block near the top of ../production/README.adoc
# (document preamble, just above "Reverse proxy").
#
# Lapis Cloud -- THIRD, CO-LOCATED instance on the SAME host as ../production/ (PdV) and
# ../production-elb/ (ELB): a dedicated STAGING/TEST instance seeded with entirely fictitious data
# ("Testverein Musterstadt e.V.", @staging.invalid emails -- see StagingSeedData KDoc). Structured
# identically to ../production-elb/docker-compose.yml (own Postgres, own containers, own named
# volumes, every host-visible port shifted again so all three stacks coexist).
#
# The one behavioral difference from PdV/ELB: this file forwards LAPIS_STAGING_MODE and
# LAPIS_STAGING_SEED_PASSWORD into the container (see the lapis-server `environment:` block below).
# PdV's and ELB's own docker-compose.yml files deliberately do NOT forward these two variables --
# see README.adoc "Staging seed mechanism" locks (3).
#
# Port scheme vs. ../production/ (PdV) and ../production-elb/ (ELB):
#   lapis-server        8080 / 8081  -> 127.0.0.1:8082 -> 8080
#   postgres (host-only) 5432 / 5433 -> 127.0.0.1:5434 -> 5432
#   livekit signaling    7880 / 7885 -> 127.0.0.1:7886 -> 7880 (Caddy-proxied, host-side remap only, fine)
#   livekit ICE tcp      7881 / 7891 -> 7901 (public, internal AND external -- see ../production-elb/'s own comment)
#   livekit ICE udp      7882 / 7892 -> 7902 (public, internal AND external)
#   coturn               3478 / 3479 -> 3480 (public, host-side remap only, fine)
#   coturn relay range   51000-51019 / 51020-51039 -> 51040-51059 (public, internal AND external)
#   coturn TLS           5350 / 5351 -> 127.0.0.1:5352 -> 5350 (optional, see README.adoc "TURNS over TLS")
#   redis (host-only)    6379 / 6380 -> 127.0.0.1:6381 -> 6379
#   egress template_port 7980 / 7981 -> 7982
#
# Usage (from this directory):
#   cp .env.example .env   # fill in real secrets AND LAPIS_STAGING_SEED_PASSWORD, never commit .env
#   ./render-secrets.sh    # renders livekit.yaml/turnserver.conf/egress.yaml from .env
#   docker compose up -d --build
#   docker compose logs -f lapis-server   # expect the "LAPIS_STAGING_MODE aktiv" WARN on first start
name: lapis-cloud-staging

networks:
  internal:

services:
  postgres:
    image: postgres:17.10
    container_name: lapis-cloud-staging-postgres
    environment:
      POSTGRES_DB: ${LAPIS_DB_NAME:-lapiscloud_staging}
      POSTGRES_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
    volumes:
      - lapis-staging-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  lapis-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: lapis-cloud-staging-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAPIS_DB_URL: jdbc:postgresql://postgres:5432/${LAPIS_DB_NAME:-lapiscloud_staging}
      LAPIS_DB_USER: ${LAPIS_DB_USER:?LAPIS_DB_USER must be set in .env}
      LAPIS_DB_PASSWORD: ${LAPIS_DB_PASSWORD:?LAPIS_DB_PASSWORD must be set in .env}
      LAPIS_PUBLIC_BASE_URL: ${LAPIS_PUBLIC_BASE_URL:?LAPIS_PUBLIC_BASE_URL must be set in .env}
      LAPIS_LIVEKIT_URL: ${LAPIS_LIVEKIT_URL:?LAPIS_LIVEKIT_URL must be set in .env}
      LAPIS_LIVEKIT_API_URL: http://livekit:7880
      LAPIS_LIVEKIT_API_KEY: ${LAPIS_LIVEKIT_API_KEY:?LAPIS_LIVEKIT_API_KEY must be set in .env}
      LAPIS_LIVEKIT_API_SECRET: ${LAPIS_LIVEKIT_API_SECRET:?LAPIS_LIVEKIT_API_SECRET must be set in .env}
      # Port 3480 -- this instance's own coturn (see port-scheme comment above).
      LAPIS_TURN_URLS: turn:${LAPIS_PUBLIC_IP:?LAPIS_PUBLIC_IP must be set in .env}:3480?transport=udp,turn:${LAPIS_PUBLIC_IP}:3480?transport=tcp
      LAPIS_TURNS_URLS: ${LAPIS_TURNS_URLS:-}
      LAPIS_TURN_SHARED_SECRET: ${LAPIS_TURN_SECRET:?LAPIS_TURN_SECRET must be set in .env}
      LAPIS_RECORDING_ENABLED: "true"
      LAPIS_EGRESS_OUTPUT_CONTAINER_DIR: /out
      LAPIS_EGRESS_OUTPUT_HOST_DIR: /app/egress-out
      LAPIS_STREAMING_ENABLED: "true"
      LAPIS_SECRET_ENCRYPTION_KEY: ${LAPIS_SECRET_ENCRYPTION_KEY:?LAPIS_SECRET_ENCRYPTION_KEY must be set in .env}
      LAPIS_BRAND_TITLE: ${LAPIS_BRAND_TITLE:-Testverein Musterstadt e.V. (STAGING)}
      LAPIS_BRAND_LOGO_PATH: ${LAPIS_BRAND_LOGO_PATH:-}
      LAPIS_BRAND_WEBSITE_URL: ${LAPIS_BRAND_WEBSITE_URL:-}
      LAPIS_LEGAL_OPERATOR_NAME: ${LAPIS_LEGAL_OPERATOR_NAME:-}
      LAPIS_LEGAL_STREET: ${LAPIS_LEGAL_STREET:-}
      LAPIS_LEGAL_POSTAL_CODE: ${LAPIS_LEGAL_POSTAL_CODE:-}
      LAPIS_LEGAL_CITY: ${LAPIS_LEGAL_CITY:-}
      LAPIS_LEGAL_COUNTRY: ${LAPIS_LEGAL_COUNTRY:-}
      LAPIS_LEGAL_CONTACT_EMAIL: ${LAPIS_LEGAL_CONTACT_EMAIL:-}
      LAPIS_LEGAL_REPRESENTATIVE: ${LAPIS_LEGAL_REPRESENTATIVE:-}
      LAPIS_LEGAL_PHONE: ${LAPIS_LEGAL_PHONE:-}
      LAPIS_LEGAL_REGISTER_COURT: ${LAPIS_LEGAL_REGISTER_COURT:-}
      LAPIS_LEGAL_REGISTER_NUMBER: ${LAPIS_LEGAL_REGISTER_NUMBER:-}
      LAPIS_LEGAL_VAT_ID: ${LAPIS_LEGAL_VAT_ID:-}
      LAPIS_LEGAL_DPO_CONTACT: ${LAPIS_LEGAL_DPO_CONTACT:-}
      LAPIS_LEGAL_MSTV_RESPONSIBLE: ${LAPIS_LEGAL_MSTV_RESPONSIBLE:-}
      LAPIS_LEGAL_SUPERVISORY_AUTHORITY: ${LAPIS_LEGAL_SUPERVISORY_AUTHORITY:-}
      # Deliberately hard OFF -- a testing instance must never send anything to the outside world.
      # See README.adoc "What is deliberately off". No .env override -- fixed "false"/empty, not
      # ${VAR:-false}, so a stray .env entry cannot silently turn one of these on.
      LAPIS_SEPA_POLLER_ENABLED: "false"
      LAPIS_DUNNING_POLLER_ENABLED: "false"
      LAPIS_DUNNING_POSTAL_DISPATCH_ENABLED: "false"
      LAPIS_WEBHOOKS_ENABLED: "false"
      LAPIS_SMTP_HOST: ""
      LAPIS_SMTP_PORT: ""
      LAPIS_SMTP_USERNAME: ""
      LAPIS_SMTP_PASSWORD: ""
      LAPIS_SMTP_FROM_ADDRESS: ""
      LAPIS_SMTP_FROM_NAME: ""
      LAPIS_SMTP_REPLY_TO: ""
      LAPIS_EMBED_ENABLED: ${LAPIS_EMBED_ENABLED:-}
      LAPIS_EMBED_ALLOWED_ORIGINS: ${LAPIS_EMBED_ALLOWED_ORIGINS:-}
      # Staging-Instanz-Welle -- the load-bearing difference from ../production/ and
      # ../production-elb/, which do NOT have these two lines at all (see this file's own header
      # comment and README.adoc "Staging seed mechanism" lock (3)). LAPIS_STAGING_MODE has no
      # default (":-" empty, not "true") -- an empty/unset .env value means Disabled, never Refused,
      # see StagingSeedConfig KDoc.
      LAPIS_STAGING_MODE: ${LAPIS_STAGING_MODE:-}
      LAPIS_STAGING_SEED_PASSWORD: ${LAPIS_STAGING_SEED_PASSWORD:-}
    volumes:
      - lapis-staging-document-storage:/app/document-storage
      - lapis-staging-egress-output:/app/egress-out
      - ./branding:/app/branding:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks: [internal]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: lapis-cloud-staging-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7886:7880"
      # No remap for these two -- must equal livekit.yaml.template's own rtc.tcp_port/udp_port.
      - "7901:7901/tcp"
      - "7902:7902/udp"
    networks: [internal]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.17.0-alpine
    container_name: lapis-cloud-staging-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn-certs:/etc/coturn/certs:ro
    ports:
      - "3480:3478/udp"
      - "3480:3478/tcp"
      - "51040-51059:51040-51059/udp"
      # TURNS over TLS -- optional, see README.adoc "TURNS over TLS". 5350 stays CONTAINER-side.
      - "127.0.0.1:5352:5350/tcp"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: lapis-cloud-staging-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"

  # network_mode: host -- same as ../production/'s and ../production-elb/'s own egress, and for the
  # identical hairpin-NAT reasoning (Chrome-based Room-Composite/GRID/SPEAKER egress needs to reach
  # this host's own public IP; see ../production-elb/docker-compose.yml's header comment for the
  # full diagnosis). Confirmed by the rest of this stack's own config: egress.yaml.template's
  # `ws_url: ws://127.0.0.1:7886` and `redis.address: 127.0.0.1:6381` only resolve under host
  # networking, not via compose-internal service names -- and `template_port: 7982` (also in
  # egress.yaml.template) keeps this safe alongside PdV's and ELB's own host-networked egress on
  # the same physical host.
  egress:
    image: livekit/egress:v1.13.0
    container_name: lapis-cloud-staging-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - lapis-staging-egress-output:/out
      - /tmp # egress scratch space
    cap_add:
      - SYS_ADMIN
    shm_size: '1gb'
    network_mode: host
    depends_on: [redis, livekit]
    restart: unless-stopped

volumes:
  lapis-staging-postgres-data:
  lapis-staging-document-storage:
  lapis-staging-egress-output:
