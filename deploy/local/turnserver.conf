# Lapis Cloud -- Wave 1 Videokonferenzen (Kleinsitzung), LOCAL DEVELOPMENT ONLY.
#
# coturn config for the sibling `coturn` service in docker-compose.yml. On a single dev machine the
# host/127.0.0.1 ICE candidate almost always wins, so this relay path is exercised only when the
# direct path fails (e.g. a peer behind a restrictive NAT). Included now because it is the component
# the production/multi-network deployment will need (per the Videokonferenzen concept note's "TURN-
# Server (coturn) fuer NAT-Traversal") -- wiring the config surface now means it exists before it is
# load-bearing. See README.adoc in this directory for the honest verification caveat (relay-path
# exercise is observational only via `docker compose logs -f coturn`, since `livekit-client` does not
# expose `iceTransportPolicy: 'relay'` to force the path from the app side).
#
# Audit-round-1 fix: `use-auth-secret`/`static-auth-secret` (coturn's own "REST API for Access to
# TURN Services" shared-secret scheme), NOT the OLD `lt-cred-mech`/`user=lapis:...` static long-term
# credential -- that pair never expired and was handed to every client verbatim regardless of room
# membership or session length. `static-auth-secret` below is NEVER itself sent to a client; the
# server (`TurnCredentialMinter.kt`) uses it to compute a fresh, short-lived username/credential pair
# per `joinRoom` call instead (same TTL as the LiveKit participant JWT) -- see that file's own KDoc
# for the exact HMAC-SHA1 scheme this directive expects. This value is still committed in plaintext,
# same DEV-ONLY posture the file header above and README.adoc already establish for
# `livekit.yaml`'s `keys.devkey` -- the secret itself being public is fine as long as (a) it never
# reaches a browser and (b) every credential minted from it expires quickly, both true here now.
listening-port=3478
min-port=51000
max-port=51019
realm=lapis.local
use-auth-secret
static-auth-secret=lapis-dev-turn-shared-secret-32bytes-min!!
external-ip=127.0.0.1
no-tls
no-dtls
fingerprint
log-file=stdout
no-cli
