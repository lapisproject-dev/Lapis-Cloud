# Lapis Cloud -- V1.0 Videokonferenzen, Wave 2 "Aufzeichnung" + Wave 3 "Externes Streaming",
# LOCAL DEVELOPMENT ONLY.
#
# Config for the sibling `egress` service in docker-compose.yml -- see this repository's kUML
# Track-Egress decision (concept note "03 Bereiche/Lapis Cloud/Videokonferenzen.md", 2026-08-01):
# the server records raw per-participant tracks in real time via LiveKit Track Egress, and a
# separate later batch job composes the gallery video (see ConferenceRecordingConfig/
# RecordingComposer KDoc for the server-side half of this).
#
# Same DEV-ONLY committed-secret header style and disclosure as livekit.yaml -- `api_key`/
# `api_secret` below MUST equal livekit.yaml's own `keys.devkey` entry byte-for-byte (egress
# authenticates against the LiveKit server's Twirp API using the SAME admin credential
# LiveKitEgressClient/LiveKitAdminClient mint tokens against), and `redis.address` MUST equal
# livekit.yaml's own new `redis:` block -- both processes must point at the SAME Redis instance
# (see docker-compose.yml's new `redis`/`egress` services and their own comments for why this
# wasn't needed in Wave 1).
log_level: info
api_key: devkey
api_secret: lapis-dev-livekit-secret-32bytes-min!! # MUST equal livekit.yaml's keys.devkey
ws_url: ws://livekit:7880 # compose service name, NOT localhost -- resolved inside the container
insecure: true # plain ws://, dev only -- same posture livekit.yaml's own header documents
redis:
  address: redis:6379

# V1.0 Videokonferenzen, Wave 3 "Externes Streaming" -- `template_base` knob, commented out.
#
# CORRECTED 2026-08-15 (this comment previously claimed the opposite and was WRONG -- do not revert
# to that version): Room-Composite egress (ConferenceStreamLayout.GRID/SPEAKER) renders through a web
# page loaded by CHROME INSIDE THIS CONTAINER, but that page is served LOCALLY, not fetched from
# `https://template.livekit.io`. The `livekit/egress:v1.13.0` binary embeds the `template-default`
# React app directly into itself at build time (`cmd/server/main.go`: `//go:embed templates` +
# `svc.StartTemplatesServer(rfs)`) and serves it on `:7980` inside the SAME container whenever
# `template_base` is unset (`pkg/config`: `defaultTemplateBase = "http://localhost:%d/"`,
# `defaultTemplatePort = 7980`) -- exactly the state below. The earlier "ships NO local templates"
# claim came from `find / -name '*.html' -path '*templ*'` finding nothing on disk, which is
# consistent with `go:embed` (the assets live inside the compiled binary, never written out as loose
# files) and does NOT mean no template server runs. Verified live on the production deployment
# 2026-08-15: `curl localhost:7980/` inside the egress container returns 200 with `template_base`
# left unset, as here.
#
# The REAL cause of the "Start signal not received"/code 412 abort signature, found the same day on
# production: this service's default 64MB `/dev/shm` is too small for Chrome's renderer/GPU buffers
# in docker-compose.yml -- Chrome loads the (working, local) template page fine but the render
# pipeline never reaches a ready state, so egress waits out its own startup timeout and aborts. Fixed
# via `shm_size: 1gb` on this service in docker-compose.yml, not via anything in this file. If you
# still see this exact signature after that fix, re-check `docker exec <egress-container> sh -c 'df -h
# /dev/shm'` before assuming a template/network issue again -- `ConferenceStreamLayout.SINGLE_PARTICIPANT`
# (`StartParticipantEgress`) never launches Chrome at all and is the fastest way to confirm the rest
# of the pipeline (LiveKit, Redis, RTMP destination) is healthy while debugging this.
#
# `template_base` remains available for a genuinely CUSTOM template (different branding/layout, not
# a reachability workaround) -- point it at a self-hosted mirror of
# https://github.com/livekit/egress/tree/main/template-default if/when that need arises:
# template_base: http://your-custom-template-server:PORT
