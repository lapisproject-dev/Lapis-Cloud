# Lapis Cloud -- Wave 1 Videokonferenzen (Kleinsitzung), LOCAL DEVELOPMENT ONLY.
#
# First infrastructure directory in this repository -- see README.adoc in this directory for the
# full local-development setup, the Colima `node_ip` trap, and why `--dev` is not used.
#
# Audit-round-1 fix: every published port below is bound to `127.0.0.1:` explicitly, not the Docker
# default of `0.0.0.0:` (every interface). `livekit.yaml` commits a real, working LiveKit API
# key/secret pair in plaintext (`devkey`/`lapis-dev-livekit-secret-32bytes-min!!`, see that file's
# own header for why this is an accepted DEV-ONLY posture) -- with an unrestricted `0.0.0.0` bind,
# anyone who can reach this machine's LAN address on port 7880 could mint their own LiveKit admin
# token client-side with that committed secret and call CreateRoom/DeleteRoom/ListRooms/
# ListParticipants/RemoveParticipant directly against LiveKit, bypassing every authorization check
# ConferenceService enforces. Loopback-only binding closes that off entirely for local development,
# where nothing outside this machine ever needs to reach LiveKit/coturn directly.
#
# **If this file is ever copied toward a real (non-loopback) deployment**: change BOTH the bind
# (these ports need to be reachable from wherever the Lapis Cloud server itself runs, which is NOT
# necessarily `127.0.0.1` anymore) AND the committed `livekit.yaml`/`turnserver.conf` secrets to
# freshly generated, deployment-specific values -- doing only one of the two still leaves the admin
# API exposed with a publicly-known secret, or a private secret nobody outside this machine can
# reach anyway. Do not carry this exact combination (loopback bind + committed secret) forward
# unexamined.
#
# Usage:
#   docker compose -f deploy/local/docker-compose.yml up -d
#   docker compose -f deploy/local/docker-compose.yml logs -f
#   docker compose -f deploy/local/docker-compose.yml down
name: lapis-conference-dev

services:
  livekit:
    # Pinned to the current stable line (verified on Docker Hub, 2026-07-31) -- deliberately not
    # `:latest`, matching this repository's general pin-exact-versions posture (see
    # gradle/libs.versions.toml).
    image: livekit/livekit-server:v1.13.5
    container_name: lapis-conference-dev-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling WebSocket (browser) + Twirp HTTP API (Ktor server's LiveKitAdminClient). Loopback-
      # only bind -- see file header "Audit-round-1 fix".
      - "127.0.0.1:7880:7880/tcp"
      # ICE/TCP fallback.
      - "127.0.0.1:7881:7881/tcp"
      # UDP mux (single-port media) -- see livekit.yaml comment for why a range is avoided.
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped

  coturn:
    # Verified on Docker Hub, 2026-08-05.
    image: coturn/coturn:4.17.0-alpine
    container_name: lapis-conference-dev-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      # Loopback-only bind -- see file header "Audit-round-1 fix". TURN credentials are short-lived
      # (see turnserver.conf's own header) but the relay port itself still only needs to be reachable
      # from this machine in local development.
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:51000-51019:51000-51019/udp"
    restart: unless-stopped

  # V1.0 Videokonferenzen, Wave 2 "Aufzeichnung" -- new. The OLD trailing comment here read "No
  # Redis -- single-node LiveKit does not need it". That was correct for Wave 1 and stops being
  # correct the moment `egress` (below) joins the stack: LiveKit's own self-hosting docs state "The
  # Egress service uses Redis messaging queues to load balance and communicate with your LiveKit
  # server" -- both processes must point at the SAME Redis instance (see livekit.yaml's new
  # `redis:` block and egress.yaml's own `redis:` block, both `redis:6379`, the compose service name
  # below).
  redis:
    image: redis:7.4-alpine # verified on Docker Hub, 2026-08-09
    container_name: lapis-conference-dev-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    # DELIBERATELY NO `ports:` -- Redis is reachable only on the compose-internal network (livekit +
    # egress). Publishing 6379, even on 127.0.0.1, would expose an unauthenticated Redis to every
    # process on the dev machine for zero benefit -- a STRICTER posture than the audit-round-1
    # `127.0.0.1:`-bind fix above, not a looser one.

  egress:
    # Pinned deliberately to the well-soaked v1.13.0 (Docker Hub, verified 2026-08-09) rather than
    # a newer line -- matches this repo's pin-exact-and-soaked posture (gradle/libs.versions.toml,
    # livekit-server:v1.13.5 above). Egress versions are numbered INDEPENDENTLY of livekit-server
    # versions; v1.13.0-egress is not "the matching build" for v1.13.5-server, it is simply the
    # current stable egress line. Re-verify on Docker Hub before bumping.
    image: livekit/egress:v1.13.0
    container_name: lapis-conference-dev-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      # The raw per-track sink -- CONTAINER path (/out). The Ktor server reads the SAME bytes from
      # the HOST path (./egress-out, gitignored) because in local dev it runs outside Docker -- see
      # LAPIS_EGRESS_OUTPUT_CONTAINER_DIR/LAPIS_EGRESS_OUTPUT_HOST_DIR in ConferenceRecordingConfig
      # KDoc for why these are two deliberately separate env vars, never collapsed into one.
      - ./egress-out:/out
      - /tmp # egress scratch space
    cap_add:
      - SYS_ADMIN # documented as required since egress v1.7.6 (Chrome sandbox); Track Egress itself
      # never launches Chrome, but the image expects the cap and it is cheap to grant in a dev stack.
    # Chrome (Room-Composite/GRID/SPEAKER egress) needs far more shared memory than Docker's 64MB
    # default for its renderer/GPU process buffers -- undersized, Chrome's page never reaches a
    # working render state and egress aborts with "Start signal not received" (code 412) after its
    # own startup timeout. Found 2026-08-15 live on the production deployment (see that
    # docker-compose.yml's own comment on this same setting for the full diagnosis); mirrored here
    # so local dev doesn't hit the identical failure the first time someone tests GRID/SPEAKER.
    shm_size: '1gb'
    depends_on: [redis, livekit]
    restart: unless-stopped
    # No published ports -- egress is driven entirely through Redis; nothing outside the compose
    # network ever talks to it directly.

  # V1.0 Videokonferenzen, Wave 3 "Externes Streaming" -- LOCAL DEV/TEST ONLY.
  # Stand-in RTMP destination so an RTMP egress can be verified end-to-end without a real
  # YouTube/Twitch account. Verified working 2026-08-09 against livekit/egress:v1.13.0:
  #   "[path live/probekey1] stream is available and online, 2 tracks (H264, MPEG-4 Audio)"
  # (see the Wave 3 implementation-plan step's own live-verification notes, and this directory's
  # README.adoc "Wave 3 'Externes Streaming'" section for the full bring-up recipe).
  rtmp-sink:
    # Digest-pinned (not `:latest`) -- matches this repo's pin-exact-versions posture
    # (gradle/libs.versions.toml, `livekit/livekit-server:v1.13.5` above). Resolved from
    # `bluenviron/mediamtx:latest` on 2026-08-09; that tag currently resolves to v1.20.0
    # (`docker run --rm bluenviron/mediamtx:latest --version`). Re-verify/re-pin before bumping.
    image: bluenviron/mediamtx@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
    container_name: lapis-conference-dev-rtmp-sink
    ports:
      # RTMP ingest (1935) is reachable ONLY on the compose-internal network -- egress talks to it
      # by service name (`rtmp://rtmp-sink:1935/live/<key>`), never published to the host. ONLY the
      # HLS playback port is published, loopback-only (same audit-round-1 `127.0.0.1:`-bind posture
      # this file's own header establishes), so a human can watch the stream back during
      # verification at `http://127.0.0.1:8888/live/<key>/index.m3u8`.
      - "127.0.0.1:8888:8888/tcp"
    restart: unless-stopped
