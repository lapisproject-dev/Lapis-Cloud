name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # V1.9.37 Postgres test lane (docs/architecture/postgres-test-lane.adoc): a throwaway PostgreSQL service
    # container, reachable on localhost through the port mapping. The password is the literal of this
    # disposable container, not a secret; it is only handed to the `check` step below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lapis_test
          POSTGRES_PASSWORD: lapis-ci-throwaway
          POSTGRES_DB: lapis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lapis_test -d lapis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # LAPIS_DB_URL is deliberately NOT set (DevSeedData's production guard keys off it, and the lane refuses to
      # run with it). The variables are set on this step only and never echoed.
      - name: Build & check (clean, incl. ktlint, detekt, Postgres lane)
        env:
          LAPIS_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/lapis_test
          LAPIS_TEST_POSTGRES_USER: lapis_test
          LAPIS_TEST_POSTGRES_PASSWORD: lapis-ci-throwaway
        run: ./gradlew clean check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7
