name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # V1.9.93: the release-image workflow runs this whole pipeline as its first job (see release-image.yml).
  workflow_call: {}

# V1.9.58: least privilege for the token; no job needs more than reading the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V1.9.58: three jobs run in parallel instead of one long serial job (see docs/architecture/ci-pipeline.adoc).
# Together they run exactly the checks the former single "Build & Test" job ran.
jobs:
  check:
    name: Check (ktlint, detekt, H2 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Runner hardware
        run: nproc; free -h

      # The Postgres lane and the browser tests run in their own jobs. LAPIS_DB_URL is deliberately NOT set anywhere
      # (DevSeedData's production guard keys off it, and the Postgres lane refuses to run with it).
      # `lapis.test.forks` spreads the H2 specs over four test JVMs (the runner has four vCPUs).
      - name: Build & check (clean, incl. ktlint, detekt, H2 tests)
        run: >-
          ./gradlew clean check
          -Plapis.test.forks=4
          -x :lapis-server:postgresTest
          -x :lapis-client:allTests -x :lapis-client:jsBrowserTest
          -x :lapis-shared:allTests -x :lapis-shared:jsBrowserTest

      # V1.9.160: every kUML block in docs/**/*.adoc must still render (about 15 seconds; the task fails if a single file fails).
      # A diagram that no longer compiles after a metamodel or DSL change used to show up only when somebody built the documentation.
      - name: Render documentation diagrams
        run: ./gradlew :docs-render:renderDocs

      # 703 XML files today (one per spec class); the floor leaves room for deleting specs but catches a lane that
      # silently ran nothing.
      - name: Assert H2 lane ran
        run: scripts/ci-assert-lane-ran.sh lapis-server/build/test-results/test 600

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-check
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7

  postgres:
    name: Postgres lane
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # V1.9.37 Postgres test lane (docs/architecture/postgres-test-lane.adoc): a throwaway PostgreSQL container, reachable on
    # localhost through the port mapping. It is started by the step "Start PostgreSQL" below (not by a `services:` block) so that
    # the image can come from three registries in turn: the shared GitHub runners hit the anonymous pull limit of Docker Hub
    # (2026-10-09) and then of the AWS public ECR mirror ("toomanyrequests: Data limit exceeded", 2026-10-15, three runs). The
    # password is the literal of this disposable container, not a secret.

    steps:
      - name: Start PostgreSQL (registry fallback)
        run: |
          started=0
          for image in public.ecr.aws/docker/library/postgres:17 mirror.gcr.io/library/postgres:17 postgres:17; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then break; fi
              echo "::warning::pull of $image failed (attempt $attempt)"
              sleep $((attempt * 5))
            done
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker run -d --name lapis-postgres -p 5432:5432 \
                -e POSTGRES_USER=lapis_test -e POSTGRES_PASSWORD=lapis-ci-throwaway -e POSTGRES_DB=lapis_test \
                --health-cmd "pg_isready -U lapis_test -d lapis_test" --health-interval 5s --health-timeout 5s --health-retries 12 \
                "$image" && started=1 && echo "PostgreSQL image: $image" && break
            fi
          done
          if [ "$started" != 1 ]; then echo "::error::no registry delivered the PostgreSQL image"; exit 1; fi
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lapis-postgres)
            if [ "$status" = healthy ]; then echo "PostgreSQL is healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become healthy"; docker logs lapis-postgres; exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Runner hardware
        run: nproc; free -h

      # The variables are set on this step only and never echoed.
      - name: Postgres lane (clean, postgresTest only)
        env:
          LAPIS_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/lapis_test
          LAPIS_TEST_POSTGRES_USER: lapis_test
          LAPIS_TEST_POSTGRES_PASSWORD: lapis-ci-throwaway
        run: ./gradlew clean :lapis-server:postgresTest

      # A SKIPPED lane (missing variable) leaves no XML and the build stays green: fail in that case.
      # 33 XML files today.
      - name: Assert Postgres lane ran (not SKIPPED)
        run: >-
          scripts/ci-assert-lane-ran.sh lapis-server/build/test-results/postgresTest 30
          TEST-network.lapis.cloud.server.rpc.ElectionIntegrityPostgresTest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-postgres
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7

  browser:
    name: Browser tests (Karma)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Runner hardware
        run: nproc; free -h

      # Own runner: the Karma/ChromeHeadless tests no longer compete with the server tests for CPU (on one shared
      # runner that caused sporadic DOM-test timeouts and "Disconnected ... ping timeout", 2026-10-03).
      - name: Browser tests (client and shared)
        run: ./gradlew :lapis-shared:allTests :lapis-client:allTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-browser
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7

  # V1.9.149: the unit and scenario tests of the encounter load-test tool (scripts/loadtest). Plain Node, no dependencies, no
  # npm install: the optional LiveKit media layer is never installed here (the tests use the fake media layer, loopback only).
  loadtest:
    name: Load-test tool (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Test the load-test tool
        run: node --test scripts/loadtest/test/*.test.mjs

  # V1.9.93: builds the release image and runs the same content check the release workflow runs, so a broken check or
  # Dockerfile shows up on the pull request and not for the first time on a release tag. Not part of the tag pipeline
  # (release-image.yml builds and checks the candidate itself), hence the event condition: workflow_call inherits the
  # caller's event (push), so this job only runs on pull requests.
  image:
    name: Release image content check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Logic test of the check script (stub docker)
        run: |
          scripts/test-ci-assert-image-clean.sh
          scripts/test-ci-pick-base-registry.sh

      # V1.9.160: same fallback as in release-image.yml, so a rate-limited primary registry does not fail a pull request either.
      - name: Pick base image registry
        id: base
        run: |
          set -euo pipefail
          echo "registry=$(scripts/ci-pick-base-registry.sh Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build candidate image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          build-args: |
            BASE_REGISTRY=${{ steps.base.outputs.registry }}
          tags: lapis-cloud-candidate:pr
          cache-from: type=gha,scope=lapis-image

      - name: Assert candidate image is clean
        run: scripts/ci-assert-image-clean.sh lapis-cloud-candidate:pr
