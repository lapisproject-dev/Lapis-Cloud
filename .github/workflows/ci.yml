name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# V1.9.58: least privilege for the token; no job needs more than reading the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V1.9.58: three jobs run in parallel instead of one long serial job (see docs/architecture/ci-pipeline.adoc).
# Together they run exactly the checks the former single "Build & Test" job ran.
jobs:
  check:
    name: Check (ktlint, detekt, H2 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runner hardware
        run: nproc; free -h

      # The Postgres lane and the browser tests run in their own jobs. LAPIS_DB_URL is deliberately NOT set anywhere
      # (DevSeedData's production guard keys off it, and the Postgres lane refuses to run with it).
      # `lapis.test.forks` spreads the H2 specs over four test JVMs (the runner has four vCPUs).
      - name: Build & check (clean, incl. ktlint, detekt, H2 tests)
        run: >-
          ./gradlew clean check
          -Plapis.test.forks=4
          -x :lapis-server:postgresTest
          -x :lapis-client:allTests -x :lapis-client:jsBrowserTest
          -x :lapis-shared:allTests -x :lapis-shared:jsBrowserTest

      # 703 XML files today (one per spec class); the floor leaves room for deleting specs but catches a lane that
      # silently ran nothing.
      - name: Assert H2 lane ran
        run: scripts/ci-assert-lane-ran.sh lapis-server/build/test-results/test 600

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-check
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7

  postgres:
    name: Postgres lane
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # V1.9.37 Postgres test lane (docs/architecture/postgres-test-lane.adoc): a throwaway PostgreSQL service
    # container, reachable on localhost through the port mapping. The password is the literal of this
    # disposable container, not a secret; it is only handed to the lane step below.
    services:
      postgres:
        # Docker's official image, mirrored by AWS (public ECR): the shared GitHub runners hit Docker Hub's anonymous pull
        # rate limit (toomanyrequests) and the lane failed before a single test ran (2026-10-09). Same image, no registry login.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: lapis_test
          POSTGRES_PASSWORD: lapis-ci-throwaway
          POSTGRES_DB: lapis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lapis_test -d lapis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runner hardware
        run: nproc; free -h

      # The variables are set on this step only and never echoed.
      - name: Postgres lane (clean, postgresTest only)
        env:
          LAPIS_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/lapis_test
          LAPIS_TEST_POSTGRES_USER: lapis_test
          LAPIS_TEST_POSTGRES_PASSWORD: lapis-ci-throwaway
        run: ./gradlew clean :lapis-server:postgresTest

      # A SKIPPED lane (missing variable) leaves no XML and the build stays green: fail in that case.
      # 33 XML files today.
      - name: Assert Postgres lane ran (not SKIPPED)
        run: >-
          scripts/ci-assert-lane-ran.sh lapis-server/build/test-results/postgresTest 30
          TEST-network.lapis.cloud.server.rpc.ElectionIntegrityPostgresTest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-postgres
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7

  browser:
    name: Browser tests (Karma)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runner hardware
        run: nproc; free -h

      # Own runner: the Karma/ChromeHeadless tests no longer compete with the server tests for CPU (on one shared
      # runner that caused sporadic DOM-test timeouts and "Disconnected ... ping timeout", 2026-10-03).
      - name: Browser tests (client and shared)
        run: ./gradlew :lapis-shared:allTests :lapis-client:allTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-browser
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
          retention-days: 7
