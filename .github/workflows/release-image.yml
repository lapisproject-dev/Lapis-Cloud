name: Release image

# V1.9.93: builds the lapis-server container image ONCE per release tag in CI and publishes it to GHCR, so the
# servers pull a fixed image instead of compiling the sources themselves (see docs/architecture/ci-pipeline.adoc,
# "Release image pipeline"). Tag pushes only: no branch, pull request, manual or scheduled trigger exists.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full CI pipeline (check, postgres, browser) must be green for the tagged commit before an image is built.
  # Tags do not trigger ci.yml, so this runs the master pipeline once more (about 15 minutes, accepted on purpose).
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build and push image
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only place in this repository with a write permission.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Values reach the shell through env: only, never through ${{ }} inside the script (script injection).
      - name: Validate tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$REF_NAME' is not of the form vX.Y.Z"
            exit 1
          fi
          version="${REF_NAME#v}"
          gradle_version="$(sed -n 's/^[[:space:]]*version = "\([0-9][0-9.]*\)".*/\1/p' build.gradle.kts | head -n 1)"
          if [ "$gradle_version" != "$version" ]; then
            echo "::error::build.gradle.kts has version '$gradle_version' but the tag is '$REF_NAME'. Bump the version before tagging."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "::error::Tagged commit $COMMIT_SHA is not on master; images are built from master commits only."
            exit 1
          fi
          {
            echo "version=$version"
            echo "short_sha=${COMMIT_SHA::7}"
            echo "image=ghcr.io/lapisproject-dev/lapis-cloud"
            echo "created=$(git show -s --format=%cI "$COMMIT_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Candidate build, loaded locally and NOT pushed: its content is inspected before anything is published.
      - name: Build candidate image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: lapis-cloud-candidate:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=lapis-image
          # Written here so the push build below reuses every layer instead of compiling a second time.
          cache-to: type=gha,scope=lapis-image,mode=max

      - name: Assert candidate image is clean
        env:
          CANDIDATE: lapis-cloud-candidate:${{ steps.meta.outputs.version }}
        run: scripts/ci-assert-image-clean.sh "$CANDIDATE"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=lapis-image
          cache-to: type=gha,scope=lapis-image,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/lapisproject-dev/Lapis-Cloud
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=lapis-cloud
            org.opencontainers.image.description=Lapis Cloud server with the web client bundle
          annotations: |
            index:org.opencontainers.image.source=https://github.com/lapisproject-dev/Lapis-Cloud
            index:org.opencontainers.image.description=Lapis Cloud server with the web client bundle
            index:org.opencontainers.image.licenses=Apache-2.0

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "- \`$IMAGE:$VERSION\`"
            echo "- \`$IMAGE:$VERSION-$SHORT_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo
            echo "Verify: \`docker buildx imagetools inspect $IMAGE:$VERSION --format '{{json .Provenance}}'\`"
            echo "Pin: \`image: $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
